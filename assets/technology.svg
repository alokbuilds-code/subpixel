<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cockpit-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121e"/>
      <stop offset="50%" stop-color="#0b2438"/>
      <stop offset="100%" stop-color="#020910"/>
    </linearGradient>
    <linearGradient id="dash-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="50%" stop-color="#282d38"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#cockpit-bg)"/>

  <!-- Minimalist Dashboard Arc -->
  <path d="M 0 160 Q 300 130 600 160 L 600 360 L 0 360 Z" fill="url(#dash-wood)"/>
  <path d="M 0 160 Q 300 130 600 160" stroke="#3d4454" stroke-width="2" fill="none"/>

  <!-- Ambient LED light bar across dashboard -->
  <path d="M 40 162 Q 300 133 560 162" stroke="#00f0ff" stroke-width="2" opacity="0.6" fill="none"/>

  <!-- Center 17" Cinematic Screen -->
  <g transform="translate(190, 70)">
    <!-- Screen Outer Bezel -->
    <rect x="0" y="0" width="220" height="145" rx="8" fill="#0c0e14" stroke="#4b5563" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="5" y="5" width="210" height="135" rx="5" fill="url(#screen-grad)"/>
    <rect x="5" y="5" width="210" height="135" rx="5" fill="url(#screen-glow)"/>

    <!-- Screen UI Elements (Tesla Infotainment Visual) -->
    <!-- Mini Navigation Map -->
    <path d="M 30 110 L 70 70 L 110 85 L 140 40" stroke="#00f0ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="140" cy="40" r="4" fill="#00f0ff"/>

    <!-- Speed Indicator -->
    <text x="175" y="35" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">75</text>
    <text x="175" y="47" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">MPH</text>

    <!-- Mini Vehicle Wireframe on screen -->
    <rect x="40" y="30" width="24" height="42" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Bottom App Dock -->
    <line x1="20" y1="124" x2="200" y2="124" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="50" cy="130" r="3" fill="#ffffff"/>
    <circle cx="75" cy="130" r="3" fill="#ffffff"/>
    <circle cx="100" cy="130" r="3" fill="#ffffff"/>
    <circle cx="125" cy="130" r="3" fill="#ffffff"/>
    <circle cx="150" cy="130" r="3" fill="#ffffff"/>
    <circle cx="175" cy="130" r="3" fill="#ffffff"/>
  </g>

  <!-- Yoke Steering Wheel Silhouette -->
  <g transform="translate(60, 180)">
    <!-- Yoke Base -->
    <path d="M 10 70 Q 50 100 90 70 L 90 30 Q 50 45 10 30 Z" fill="#181a20" stroke="#4b5563" stroke-width="2"/>
    <!-- Left Grip -->
    <rect x="0" y="20" width="16" height="50" rx="8" fill="#1e222b" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Right Grip -->
    <rect x="84" y="20" width="16" height="50" rx="8" fill="#1e222b" stroke="#4b5563" stroke-width="1.5"/>
    <!-- Center Tesla T badge -->
    <text x="43" y="62" fill="#e82127" font-family="sans-serif" font-size="14" font-weight="bold">T</text>
  </g>

  <!-- Passenger Dash Area -->
  <g transform="translate(430, 200)">
    <rect x="0" y="0" width="130" height="80" rx="12" fill="#181b22" stroke="#2c3240" stroke-width="1.5"/>
    <line x1="15" y1="35" x2="115" y2="35" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="15" y="25" fill="#9ca3af" font-family="sans-serif" font-size="9" letter-spacing="1">CLIMATE CONTROL</text>
    <text x="15" y="60" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="600">70°</text>
    <text x="45" y="60" fill="#6b7280" font-family="sans-serif" font-size="10">AUTO</text>
  </g>
</svg>
