<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="45%" stop-color="#2a2948"/>
      <stop offset="75%" stop-color="#7d434d"/>
      <stop offset="100%" stop-color="#e07a5f"/>
    </linearGradient>
    <linearGradient id="mountains-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d263a"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="mountains-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191d24"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
  </defs>

  <!-- Dramatic Sunset Sky -->
  <rect width="600" height="360" fill="url(#sky)"/>

  <!-- Distant Mountain Ridge -->
  <path d="M 0 180 L 70 140 L 130 160 L 220 110 L 290 150 L 370 100 L 460 145 L 530 115 L 600 160 L 600 360 L 0 360 Z" fill="url(#mountains-far)"/>

  <!-- Near Mountain Ridge -->
  <path d="M 0 220 L 120 165 L 200 200 L 310 140 L 420 190 L 510 155 L 600 210 L 600 360 L 0 360 Z" fill="url(#mountains-near)"/>

  <!-- Glowing Sun on Horizon -->
  <circle cx="310" cy="140" r="16" fill="#fff3b0" opacity="0.85"/>
  <circle cx="310" cy="140" r="38" fill="#e07a5f" opacity="0.3"/>

  <!-- Winding Coastal / Mountain Highway -->
  <path d="M 310 180 Q 280 230 360 270 T 260 360 L 380 360 Q 450 290 340 230 Q 330 200 320 180 Z" fill="url(#road)"/>

  <!-- Highway Yellow Center Line (Dashed) -->
  <path d="M 315 180 Q 285 230 365 270 T 320 360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" fill="none"/>

  <!-- Tail Light Trail of Electric Car along the curve -->
  <path d="M 330 220 Q 370 250 350 280" stroke="#e82127" stroke-width="3" opacity="0.85" fill="none" stroke-linecap="round"/>
  <circle cx="350" cy="280" r="3" fill="#e82127"/>

  <!-- Range Indicator HUD overlay -->
  <g transform="translate(420, 40)">
    <rect x="0" y="0" width="140" height="52" rx="10" fill="rgba(10,12,16,0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="24" fill="#9ca3af" font-family="sans-serif" font-size="9" letter-spacing="1">RANGE EPA EST.</text>
    <text x="14" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">405 MILES</text>
  </g>
</svg>
